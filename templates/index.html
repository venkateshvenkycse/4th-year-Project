<!DOCTYPE html>
<html>
<head>

<title>Healthcare Assistant Chatbot</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

body{
font-family: 'Poppins', sans-serif;
background: linear-gradient(135deg,#4facfe,#00f2fe);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
margin:0;
}

.chatbox{
width:420px;
background:white;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
overflow:hidden;
}

.header{
background:#0d6efd;
color:white;
padding:15px;
font-size:20px;
font-weight:600;
}

#messages{
height:320px;
overflow-y:auto;
padding:15px;
background:#f9fbff;
}

.user{
background:#0d6efd;
color:white;
padding:10px 14px;
border-radius:15px;
margin:8px 0;
width:max-content;
max-width:75%;
margin-left:auto;
}

.bot{
background:#e9f1ff;
color:#333;
padding:10px 14px;
border-radius:15px;
margin:8px 0;
width:max-content;
max-width:50%;
}

.inputArea{
display:flex;
border-top:1px solid #ddd;
}

input{
flex:1;
border:none;
padding:12px;
font-size:14px;
outline:none;
}

button{
background:#0d6efd;
color:white;
border:none;
padding:12px 18px;
cursor:pointer;
font-weight:500;
transition:0.3s;
}

button:hover{
background:#084cdf;
}

</style>

</head>

<body>

<div class="chatbox">

<div class="header">
🩺 Healthcare Assistant
</div>

<div id="messages"></div>

<div class="inputArea">
<input id="userInput" placeholder="Enter your disease or symptom...">
<button onclick="sendMessage()">Send</button>
</div>

</div>

<script>

function sendMessage(){

let input=document.getElementById("userInput").value;

fetch("/chat",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({message:input})
})
.then(res=>res.json())
.then(data=>{

let chat=document.getElementById("messages");

chat.innerHTML += `<div class="user"><b>You:</b> ${input}</div>`;

chat.innerHTML += `<div class="bot"><b>Disease Info:</b> ${data.description}</div>`;
chat.innerHTML += `<div class="bot"><b>Precautions:</b> ${data.precautions}</div>`;
chat.innerHTML += `<div class="bot"><b>Diet:</b> ${data.diet}</div>`;

chat.scrollTop = chat.scrollHeight;

});

}

</script>

</body>
</html>
